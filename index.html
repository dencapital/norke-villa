      body:{en:`Tap water is <b>not</b> for drinking. Every room has its own water cooler with fresh drinking water.`,

            zh:`自来水 <b>不可</b> 饮用。每间客房均配有独立饮水机。`} },
    { ic:"🚕", t:{en:"Getting Around",ru:"Как передвигаться",id:"Transportasi",zh:"出行"},
      body:{en:`Ubud centre is ~10 min away. Grab & Gojek work here; for a private driver, tap Transportation above.`,
            ru:`До центра Убуда ~10 мин. Grab и Gojek работают; личный водитель — в разделе «Транспорт».`,

Guide.views.explore = {
  get title(){ return L("exploreAll"); }, get kicker(){ return L("chExplore"); }, get sub(){ return L("nbIntro"); }, img:"assets/img/monkey-forest.jpg",
  get nav(){ return CONFIG.nearby.filter(c => c.key !== "tours").map(c => [c.key, L(NBK[c.key])]); },
  body(){ return CONFIG.nearby.filter(c => c.key !== "tours").map(c => h.sec(c.key, L(NBK[c.key]), "",
      h.places([...c.places].sort((a, b) => (b.img ? 1 : 0) - (a.img ? 1 : 0)).map(p => ({ name:p.name, img:p.img, star:p.tag, dist:p.dist, note:t(p.note), cost:t(p.cost), maps:p.maps })), k => L(k === "directions" ? "nbDirections" : k)))).join(""); }
};
const NBK = {free:"nbFree", sunset:"nbSunset", wellness:"nbWellness", nightlife:"nbNightlife", eat:"nbEat", essentials:"nbEssentials", tours:"nbTours"};
Guide.views.house = { get title(){ return L("secHome"); }, kicker:"Norke Villa", get sub(){ return L("homeIntro"); }, img:"assets/svc/jv_jungle.webp",
  body(){ return h.sec("house", L("secHome"), "", h.acc(CONFIG.smartHome.map(r => ({ e:r.ic, t:t(r.t), body:t(r.body) })))); } };
Guide.views.know = { get title(){ return L("secKnow"); }, kicker:"Norke Villa", get sub(){ return L("iKnowS"); }, img:"assets/video/jv_wide.jpg",
  get nav(){ return [["know", L("secKnow")], ["useful", L("secUseful")]]; },
  body(){ return h.sec("know", L("secKnow"), "", h.acc(CONFIG.goodToKnow.map(r => ({ e:r.ic, t:t(r.t), body:t(r.body) }))))
      + h.sec("useful", L("secUseful"), "", `<div class="ilist">${CONFIG.useful.map(u => `<a class="irow" href="${u.href}" ${u.href.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}><span class="ic">${ic(u.ic === "cart" ? "cart" : u.ic)}</span><span class="b"><span class="t">${esc(t(u.tt))}</span><br><span class="m">${esc(t(u.dd))}</span></span><span class="ch">${ic("chev")}</span></a>`).join("")}</div>`); } };
Guide.views.wild = { get title(){ return L("secWild"); }, kicker:"Norke Villa", get sub(){ return L("wlIntro"); }, img:"assets/img/monkey-forest.jpg",
  body(){ return h.sec("wild", L("secWild"), "", CONFIG.wildlife.map(g => `<div class="wl ${g.tone}"><h4>${g.ic} ${esc(t(g.t))}</h4>${g.items.map(it => `<div class="it"><span>${it.emoji}</span><span>${esc(t(it.text))}</span></div>`).join("")}</div>`).join("")); } };
Guide.views.phrases = { get title(){ return L("secPhrases"); }, kicker:"Norke Villa", get sub(){ return L("phrasesIntro"); }, img:"assets/img/ubud-tour.jpg",
  body(){ return h.sec("phr", L("secPhrases"), "", `<div class="card" style="padding:4px 16px">${CONFIG.phrases.map(p => `<div class="phr"><div class="i">${esc(p.id)}<span class="p">${esc(p.pron)}</span></div><div class="m">${esc(t(p.mean))}</div></div>`).join("")}</div>`); } };
Guide.views.pay = { get title(){ return L("secPayment"); }, kicker:"DANA · QRIS", get sub(){ return L("payIntro"); }, img:"assets/svc/bf_drinks.webp",
  body(){ const pay = CONFIG.payment || {}; return h.sec("pay", L("secPayment"), "", `<div class="card center"><div class="qr"><img src="${pay.qrImage}" alt="Payment QR (DANA / QRIS)"></div><p style="font-weight:600;margin:14px 0 4px">${esc(L("payScan"))}</p>${h.note(L("payHint"))}${pay.url ? `<a class="lbtn dark" style="margin-top:12px" href="${pay.url}" target="_blank" rel="noopener">${esc(L("payOnline"))}</a>` : ""}</div>`); } };

/* ---------- home ---------- */
function renderHome(){
  document.documentElement.lang = lang;
  $$("[data-i]").forEach(el => el.textContent = L(el.dataset.i));
  $$("[data-ih]").forEach(el => el.innerHTML = L(el.dataset.ih));
  Guide.langMenu($("#langs"), LANGS, lang, code => { lang = code; try { localStorage.setItem("jvLang2", lang); } catch(_){} renderHome(); Guide.repaint(); dyn(); });
  $("#heroSub").textContent = t(CONFIG.villa.tagline);
  $("#stayCard").innerHTML = `
    <div class="stay-h"><div class="stay-ph" style="background-image:url('${(CONFIG.gallery || [])[0] || "assets/video/jv_wide.jpg"}'),url('assets/video/jv_wide.jpg')"></div>
      <div class="b"><div class="k">${esc(L("stayK"))}</div><div class="n">Norke Villa</div><div class="a">${esc(CONFIG.villa.address)}</div></div>
      <a class="iconbtn" href="${CONFIG.villa.mapsUrl}" target="_blank" rel="noopener" aria-label="${esc(L("fuBtn"))}">${ic("pin")}</a></div>
    <div class="stay-g">
      <button type="button" data-view="stay"><span class="l">${ic("wifi")}Wi-Fi</span><span class="v">Norke Villa 1 / 2</span><span class="s">${esc(L("wifiS"))}</span></button>
      <a href="${waMsg(PH, "waHelp")}" target="_blank" rel="noopener"><span class="l">${ic("chat")}${esc(L("concierge"))}</span><span class="v">${esc(L("concHours"))}</span><span class="s">${esc(L("conciergeS"))}</span></a></div>`;
  const tiles = [
    ["move", "gMove", "gMoveS", "assets/svc/jv_rush2.webp", 4, "big"],
    ["spa", "gSpa", "gSpaS", "assets/svc/spa_massage.webp", HUB_DATA.spa.length + HUB_DATA.nails.length],
    ["food", "gFood", "gFoodS", "assets/svc/bf_hero.webp", 1 + CONFIG.menu.reduce((s, g) => s + g.items.length, 0) + svcCat("Food & Dining").length - 1],
    ["tours", "gTours", "gToursS", "assets/img/ubud-tour.jpg", ((CONFIG.nearby.find(c => c.key === "tours") || {places:[]}).places.length) + svcCat("Tours & Activities").length + ADV.length],
    ["celebrate", "gCele", "gCeleS", "assets/img/honeymoon-proposal-setup.jpg", svcCat("Decorations").length + 2],
    ["home", "gHome", "gHomeS", "assets/video/jv_wide.jpg", 4, "wide"]
  ];
  $("#bento").innerHTML = tiles.map(([id, tt, s, img, n, cls]) => `
    <button type="button" class="tile rv ${cls || ""}" data-view="${id}" style="background-image:url('${img}')"><span class="bg"></span>
      <span class="go">${ic("arrow")}</span><span class="in"><span class="c">${n} ${esc(L("services"))}</span><h3>${esc(L(tt))}</h3><p>${esc(L(s))}</p></span></button>`).join("");
  const feat = CONFIG.nearby.filter(c => c.key !== "tours").flatMap(c => c.places.filter(p => p.img).map(p => [c.key, p])).concat(CONFIG.nearby.filter(c => c.key !== "tours").flatMap(c => c.places.filter(p => !p.img).slice(0, 1).map(p => [c.key, p])));
  $("#rail").innerHTML = feat.slice(0, 7).map(([k, p], i) => `
    <button type="button" class="pcard" data-view="explore" data-sub="${k}"><div class="ph ${p.img ? "" : "txt"}" ${p.img ? `style="background-image:url('${p.img}')"` : ""}><span class="tag">${esc(L(NBK[k]))}</span>${p.img ? "" : "0" + (i + 1)}</div><div class="b"><div class="t">${esc(p.name)}</div><div class="m">${esc(t(p.note) || "")}${p.dist ? " · " + esc(p.dist) : ""}</div></div></button>`).join("");
  $("#infoList").innerHTML = [["wifi","iWifi","iWifiS","stay"],["home","secHome","iHouseS","house"],["book","secKnow","iKnowS","know"],["phone","secUseful","iHelpS","know","useful"],["paw","secWild","iWildS","wild"],["chat","secPhrases","iPhrS","phrases"],["card","secPayment","iPayS","pay"]]
    .map(([k, tt, s, view, sub]) => `<button type="button" class="irow" data-view="${view}" ${sub ? `data-sub="${sub}"` : ""}><span class="ic">${ic(k)}</span><span class="b"><span class="t">${esc(L(tt))}</span><br><span class="m">${esc(L(s))}</span></span><span class="ch">${ic("chev")}</span></button>`).join("");
  $("#teamList").innerHTML = [CONFIG.staff.concierge, CONFIG.staff.housekeeping, CONFIG.staff.support].map(s => `
    <a class="person" target="_blank" rel="noopener" href="${waMsg(s.phone, "waHi")}"><div class="av">${esc(s.name.trim()[0])}</div><div class="b"><div class="n">${esc(s.name)}</div><div class="r">${esc(t(s.role))}</div></div><span class="pill-wa">${Kit.icon.wa.replace('width="20" height="20"', "")} WhatsApp</span></a>`).join("");
  $("#fbBad").href = waMsg(CONFIG.staff.support.phone, "waReport");
  $("#fbGood").href = /YOUR-/.test(CONFIG.reviewUrl) ? wa(PH, fill(L("waHi")) + " ★★★★★ ") : CONFIG.reviewUrl;
  Kit.relabel(); Guide.reveal();
}
function dyn(){
  $$(".k-step").forEach(w => Kit.setStep(w, +w.dataset.val));
  HUB_DATA.scooters.forEach(b => { const el = document.querySelector(`[data-tot="${b.id}"]`); if (el) el.textContent = HS.days > 1 ? `${hunit(HS.days, L("dayU"))} · ${fmt(b.price * HS.days)}` : ""; });
  const sum = document.querySelector('[data-sum="transfer"]'); if (sum) sum.textContent = (L("trDir").find(x => x[0] === HS.trDir) || [])[1] || "";
  Kit.updatePrices(); Kit.sync();
}
document.addEventListener("click", e => {
  const lb = e.target.closest("#langs button");
  if (lb){ lang = lb.dataset.lang; try { localStorage.setItem("jvLang", lang); } catch(_){} renderHome(); Guide.repaint(); dyn(); }
});
document.addEventListener("kpick", e => { const {group, value} = e.detail;
  if (group === "trDir" || group === "tpLen" || group === "atv" || group === "utv") HS[group] = value; else if (group === "bfAt" || group === "hkDay" || group === "hkTime") HS[group] = +value;
  else if (group && group.startsWith("spa-")) HS.spa[group.slice(4)] = +value; dyn(); });
document.addEventListener("kstep", e => { HS[e.detail.name] = e.detail.value; dyn(); });
document.addEventListener("input", e => { if (/^(tr|tp)/.test(e.target.id)) dyn(); });

Kit.init({ lang:() => lang, L:k => { const v = I18N[lang] && I18N[lang][k]; return v != null ? v : k; }, phone:PH, villa:() => V, chatHref:() => waMsg(PH, "waHelp"), roomField:true });
Guide.setup({ L:k => L(k === "copied" ? "wCopied" : k), afterRender:dyn });
Kit.mountDock();
renderHome();
Guide.mount();
Guide.hero($("#top"), { wide:{src:"assets/video/jv_wide.mp4", poster:"assets/video/jv_wide.jpg"}, mobile:{src:"assets/video/jv_m.mp4", poster:"assets/video/jv_wide.jpg"} });
dyn();

</script>
</body>
</html>
